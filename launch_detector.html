<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch CodeWinnow</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f4f7fb;
      color: #172033;
    }

    main {
      width: min(32rem, calc(100% - 2rem));
      padding: 2rem;
      border: 1px solid #d9e0ea;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 30px #17203314;
      text-align: center;
    }

    h1 { margin-top: 0; }
    p { color: #596579; line-height: 1.5; }

    button {
      padding: .75rem 1.25rem;
      border: 0;
      border-radius: 7px;
      background: #155eef;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #0d4dcc; }
    code { padding: .15rem .3rem; border-radius: 4px; background: #eef2f7; }
  </style>
</head>
<body>
  <main>
    <h1>CodeWinnow</h1>
    <p>Start the local Python server, then open the detector in a new browser tab.</p>
    <button id="launch" type="button">Launch detector</button>
    <p id="status" role="status"></p>
    <p><small>Server command: <code>python3 -m plagiarism_detector.web</code></small></p>
  </main>

  <script>
    const detectorUrl = "http://127.0.0.1:8000";
    const launchButton = document.querySelector("#launch");
    const status = document.querySelector("#status");

    launchButton.addEventListener("click", () => {
      const tab = window.open(detectorUrl, "_blank", "noopener");
      status.textContent = tab
        ? "The detector was opened in a new tab."
        : "Your browser blocked the new tab. Allow pop-ups and try again.";
    });
  </script>
</body>
</html>
